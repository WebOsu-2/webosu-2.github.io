name: minify
run-name: Minify JS/CSS/HTML [gh-pages branch]

on:
  push:
    branches:
      - 'master'  # Keeps 'master' as the trigger branch
permissions:
  contents: write

jobs:
  checkout-minify-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js and CLI tools
      - name: Install minification tools
        run: |
          npm install -g terser
          npm install -g csso-cli
          npm install -g html-minifier

      # Minify JS files (overwrite original files).
      # Game code is mixed: native ES modules need --module, but classic
      # scripts MUST NOT get it -- --module implies top-level tree-shaking,
      # which deletes their cross-file globals (this once shipped empty
      # launchgame.js/downloader.js and broke the whole live site).
      # Rule: a file is ESM iff it has a top-level import/export statement.
      - name: Minify JavaScript
        run: |
          find ./scripts -name "*.js" ! -name "*.min.js" | while read -r f; do
            if grep -qE '^\s*(import|export)[ (]' "$f"; then
              terser "$f" --module --compress --mangle -o "$f"
            else
              terser "$f" --compress --mangle -o "$f"
            fi
          done

      # Minify CSS files (overwrite original files)
      - name: Minify CSS
        run: |
          find ./style -name "*.css" ! -name "*.min.css" -exec sh -c 'csso "{}" -o "{}"' \;

      # Minify HTML files (overwrite original files)
      - name: Minify HTML
        run: |
          find . -maxdepth 1 -name "*.html" -exec sh -c 'for f; do html-minifier "$f" --collapse-boolean-attributes --collapse-whitespace --minify-css --minify-js --minify-urls --remove-empty-attributes --remove-redundant-attributes --remove-script-type-attributes --remove-style-link-type-attributes --use-short-doctype -o "$f.tmp" && mv "$f.tmp" "$f"; done' sh {} +


      # Browsers/CDN cache asset URLs aggressively; a stale bundle once
      # kept serving a fixed bug for days. Suffix local scripts/styles
      # (HTML attrs and dynamic loads in jsloader) with the commit hash.
      # Deploy-only: master sources stay clean.
      - name: Cache-bust local assets
        run: |
          V=${GITHUB_SHA::7}
          for f in *.html; do
            sed -i -E 's#((src|href)=")(scripts/[^"]*\.js|style/[^"]*\.css)"#\1\3?v='"$V"'"#g' "$f"
          done
          for f in scripts/*.js; do
            sed -i -E 's#"(scripts/[^"]*\.js)"#"\1?v='"$V"'"#g' "$f"
          done
          # ESM relative imports ('./x.js', '../lib/y.mjs', any depth,
          # either quote style after minification): without this a fresh
          # entry module loads stale cached dependencies (module found
          # but a new export missing). Excludes already-busted refs.
          find scripts -name '*.js' ! -name '*.min.js' | while read -r f; do
            sed -i -E "s#(['\"])(\./|\.\./)([^'\"?]*\.m?js)(['\"])#\1\2\3?v=$V\4#g" "$f"
          done
          echo "busted refs (expect > 0):"
          grep -oh 'scripts/[a-z0-9./_-]*\.js?v=[0-9a-f]*' index.html scripts/jsloader.js 2>/dev/null | sort -u | head -n 8
          test "$(grep -oh 'scripts/[a-z0-9./_-]*\.js?v=[0-9a-f]*' index.html | wc -l)" -gt 0
          echo "busted relative imports (expect > 0):"
          grep -rhoE "\./[^\"']*\.m?js\?v=[0-9a-f]+" --include='*.js' --exclude='*.min.js' scripts 2>/dev/null | sort -u | head -n 8
          test "$(grep -rhoE "\./[^\"']*\.m?js\?v=[0-9a-f]+" --include='*.js' --exclude='*.min.js' scripts 2>/dev/null | wc -l)" -gt 0
          echo "unbusted relative imports (expect 0):"
          grep -rhoE "\./[^\"']*\.m?js['\"]" --include='*.js' --exclude='*.min.js' scripts 2>/dev/null | sort -u | head -n 8
          test "$(grep -rhoE "\./[^\"']*\.m?js['\"]" --include='*.js' --exclude='*.min.js' scripts 2>/dev/null | wc -l)" -eq 0

      # Push changes to `gh-pages` branch
      - name: Push to gh-pages branch
        run: |
          git config pull.rebase false
          git config --global user.email "mostlime@outlook.com"
          git config --global user.name "Mostlime12195"
          git checkout -B gh-pages || git checkout --orphan gh-pages
          git fetch origin gh-pages --unshallow || true
          git reset --soft origin/gh-pages || true
          git add -A
          git commit -m "Automated minify of ${{ github.sha }}" || echo "No changes to commit"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
