name: js-syntax
run-name: JS syntax check

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      # Syntax-check game scripts (skip vendored *.min.js).
      # --input-type=module: game code is ESM; classic scripts parse as
      # modules too, so one pass covers both.
      - name: Syntax-check game scripts (skip vendored *.min.js)
        run: |
          fail=0
          for f in $(find scripts -name '*.js' ! -name '*.min.js'); do
            node --input-type=module --check < "$f" || fail=1
          done
          exit $fail

      - name: Run unit/regression suite (zero-dep node tests)
        run: node tests/run.js
