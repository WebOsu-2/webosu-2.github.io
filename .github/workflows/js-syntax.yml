name: js-syntax
run-name: JS syntax check

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      # Syntax-check game scripts (skip vendored *.min.js).
      # --input-type=module: game code is ESM; classic scripts parse as
      # modules too, so one pass covers both.
      - name: Syntax-check game scripts (skip vendored *.min.js)
        run: |
          fail=0
          for f in $(find scripts -name '*.js' ! -name '*.min.js'); do
            node --input-type=module --check < "$f" || fail=1
          done
          exit $fail

      - name: Run unit/regression suite (zero-dep node tests)
        run: node tests/run.js

      - name: Minify smoke (public globals survive minification)
        # Regression guard: terser --module tree-shakes classic scripts'
        # cross-file globals (once shipped empty launchgame.js). Mirrors
        # the minify.yml per-file rule and asserts survivors.
        run: |
          npm install -g terser
          fail=0
          check() {
            if grep -qE '^\s*(import|export)[ (]' "$1"; then terser "$1" --module --compress --mangle -o /tmp/sm.js;
            else terser "$1" --compress --mangle -o /tmp/sm.js; fi
            grep -q "$2" /tmp/sm.js || { echo "LOST: $2 in $1"; fail=1; }
          }
          check scripts/addbeatmaplist.js "function addBeatmapKind"
          check scripts/launchgame.js "function launchGame"
          check scripts/config.js "function getDownloadUrl"
          check scripts/downloader.js "function startpreview"
          check scripts/settings.js "function setOptionPanel"
          check scripts/osu.js "scaleChartForRate"
          check scripts/playback.js "export default"
          exit $fail
