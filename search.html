<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GZ2M72GJ5S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-GZ2M72GJ5S');
  </script>

  <meta charset="utf-8" />
  <title>Search</title>
  <link rel="stylesheet" href="style/picnic.min.css" />
  <link rel="stylesheet" type="text/css" href="style/main.css" />
  <link rel="stylesheet" type="text/css" href="style/font.css" />
  <link rel="icon" href="favicon.png" />

  <meta name="viewport" content="width=device-width">
  <meta name="description"
    content="Play WebOsu – A browser-based rhythm game inspired by osu!std. Experience fast-paced gameplay with an extensive beatmap library. No downloads, play free online now!">
<script src="scripts/config.js"></script>
  <script src="scripts/launchgame.js"></script>
  <script src="scripts/downloader.js"></script>
  <script src="scripts/addbeatmaplist.js"></script>
  <script src="scripts/settings.js"></script>
  <script src="scripts/jsloader.js"></script>
</head>

<body>
  <div class="game-area" id="game-area" hidden></div>

  <div class="pause-menu" id="pause-menu" hidden>
    <div class="paused-title">paused</div>
    <div class="button-list">
      <div class="pausebutton continue" id="pausebtn-continue">
        <div class="inner">Continue</div>
      </div>
      <div class="pausebutton retry" id="pausebtn-retry">
        <div class="inner">Retry</div>
      </div>
      <div class="pausebutton quit" id="pausebtn-quit">
        <div class="inner">Quit</div>
      </div>
    </div>
  </div>

  <nav id="main-nav"></nav>

  <script>
    fetch("navbar.html")
      .then((response) => response.text())
      .then((content) => {
        document.getElementById("main-nav").innerHTML = content;
      });
  </script>

  <div class="main-page" id="main-page">
    <div class="main-content">
      <div class="search-head">
        <h1>Search beatmaps</h1>
        <div class="search-filters" id="search-filters" hidden>
          <label>Status
            <select id="filter-status">
              <option value="any">Any status</option>
              <option value="1">Ranked</option>
              <option value="2">Approved</option>
              <option value="3">Qualified</option>
              <option value="4">Loved</option>
              <option value="0">Pending</option>
              <option value="-1">WIP</option>
              <option value="-2">Graveyard</option>
            </select>
          </label>
        </div>
      </div>
      <div class="beatmap-list" id="beatmap-list">
        <!-- to be filled in script -->
      </div>
      <div class="button" style="width: 100%; margin-bottom: 10px" id="btnmore">
        Load more
      </div>
      <div id="footer"></div>
      <script>
        fetch("footer.html")
          .then((response) => response.text())
          .then((content) => {
            document.getElementById("footer").innerHTML = content;
          });
      </script>
    </div>
    <!-- <div class="side-panel">
                to be activated in script
            </div> -->
    <div class="statuslines" id="statuslines">
      <div class="progress" id="script-progress">
        Scripts
        <div class="lds-dual-ring"></div>
      </div>
      <div class="progress" id="skin-progress">
        Skin
        <div class="lds-dual-ring"></div>
      </div>
      <div class="progress" id="sound-progress">
        Hitsounds
        <div class="lds-dual-ring"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var url = new URL(window.location.href);
      var keyword = (url.searchParams.get("q") || "").trim();
      var listEl = document.getElementById("beatmap-list");
      var moreBtn = document.getElementById("btnmore");
      if (!keyword) {
        listEl.innerText = "Type a keyword or beatmap id to search.";
        moreBtn.style.display = "none";
        return;
      }
      if (keyword == parseInt(keyword, 10)) {
        // is sid
        addBeatmapSid(keyword);
        moreBtn.style.display = "none";
        return;
      }
      document.getElementById("search-filters").removeAttribute("hidden");
      function currentFilter() {
        var status = document.getElementById("filter-status").value;
        var sf = (typeof statusFilter === "function") ? statusFilter(status) : null;
        return sf;
      }
      var pager = createBeatmapPager(listEl, moreBtn, function (off) {
        var r = buildListUrl("search", off, { limit: 20, keyword: keyword });
        r.filter = currentFilter();
        return r;
      });
      pager.loadMore();
      document.getElementById("filter-status").onchange = function () { pager.reset(); };
    })();
  </script>
</body>

</html>
